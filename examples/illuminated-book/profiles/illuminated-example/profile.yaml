# An unused, empty register rail avoids the current slots-only JSON-null filter bug.
# Visible decorative rails are separate manifest-owned illumination.
schema_version: profile_package_v1
id: illuminated-example
title: Illuminated book example
extends: document-spine
defaults:
- defaults.yaml
tex:
- .
ornaments:
  rails:
    class: example-register
    art: []
  slots:
    whisper:
      class: whisper
      height: 0.45em
      gap: 0.3\baselineskip
      art:
      - assets/whisper-scroll.png
    breath:
      class: breath
      height: 0.9em
      gap: 0.5\baselineskip
      art:
      - assets/leaf-bud.png
    hinge:
      class: hinge
      height: 1.55em
      gap: 0.7\baselineskip
      art:
      - assets/hinge-tendrils.png
    tailpiece:
      class: tailpiece
      height: 1.2em
      gap: 0.6\baselineskip
      art:
      - assets/tailpiece-vine.png
