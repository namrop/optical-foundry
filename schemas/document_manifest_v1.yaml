# Document Manifest Schema — v1
# Reference schema for faithful single Markdown document manifests.

schema: document_manifest_v1
description: >
  Schema for document-family render manifests. A document manifest renders one
  canonical Markdown source through direct document semantics while allowing
  manifest-visible metadata overrides, render controls, and guarded profile or
  template variables. It must not assemble bundles, insert wrapper headings,
  demote headings, or require human-visible provenance pages.

required:
  - kind
  - schema_version
  - document_id
  - profile
  - source

properties:
  kind:
    type: string
    const: markdown_document

  schema_version:
    type: string
    const: document_manifest_v1

  document_id:
    type: string
    description: Stable render/evidence identifier for the document projection.
    pattern: "^[a-z][a-z0-9_-]+$"

  profile:
    type: string
    description: Profile ID from the profile registry.

  source:
    type: object
    required: [path]
    properties:
      path:
        type: string
        description: Path to the canonical Markdown source.
      role:
        type: string
        enum: [document_source, document, body, mainmatter, main_matter, main-matter, frontmatter, front_matter, front-matter]
        default: document_source
        description: >
          Single-document matter role. `frontmatter` emits a memoir `\\frontmatter`
          transition before the source body. Use this sparingly on the direct
          document path; recurring front matter usually warrants a manifest.
      document_role:
        type: string
        enum: [document_source, document, body, mainmatter, main_matter, main-matter, frontmatter, front_matter, front-matter]
        description: Alias for role when source authors want an explicit document-role key.
      matter:
        type: string
        enum: [document_source, document, body, mainmatter, main_matter, main-matter, frontmatter, front_matter, front-matter]
        description: Alias for role focused on memoir/Pandoc matter designation.
      heading_transform:
        type: string
        enum: [preserve]
        default: preserve

  metadata:
    type: object
    description: >
      Manifest-owned metadata overrides. With source_then_manifest_override,
      these fields override same-named source frontmatter fields.
    additionalProperties: true

  variables:
    type: object
    description: >
      Guarded profile/template variable passthrough. Implementations should
      allowlist scalar keys per profile contract and reject unsafe keys or paths.
      Supported title-page controls include `titlepage: true` and
      `titlepage_background_image: assets/path.png` for a full-page title-page
      image background. Image paths must be relative to render resource roots;
      absolute paths, parent traversal, URLs, and LaTeX control tokens are
      rejected.
    additionalProperties: true

  render:
    type: object
    properties:
      preserve_source_metadata:
        type: boolean
        default: true
      metadata_merge_policy:
        type: string
        enum: [source_then_manifest_override]
        default: source_then_manifest_override
      include_toc:
        type: boolean
        default: false
      toc_depth:
        type: integer
        default: 3
      numbersections:
        type: boolean
        default: false
      page_size:
        type: string
        enum: [letter, a4, A4, a4paper, a5, A5, a5paper, half_letter, half-letter, "half letter", halfletter, statement]
        default: letter
        description: >
          Optional PDF paper-size override for compatible document-spine LaTeX
          profiles. A4 and A5 lower to geometry paper options; half-letter lowers
          to paperwidth=5.5in and paperheight=8.5in. Unsupported arbitrary sizes
          are rejected deliberately.
      margin:
        type: string
        pattern: '^(?:\\d+(?:\\.\\d+)?|\\.\\d+)(?:in|pt|mm|cm|pc|em|ex)$'
        description: >
          Optional uniform page-margin override for document-spine profiles,
          e.g. 0.7in. Omit to preserve the active profile default margin.
      page_margin:
        type: string
        pattern: '^(?:\\d+(?:\\.\\d+)?|\\.\\d+)(?:in|pt|mm|cm|pc|em|ex)$'
        description: Alias for margin.
      margins:
        type: object
        additionalProperties: false
        properties:
          top: { type: string }
          bottom: { type: string }
          left: { type: string }
          right: { type: string }
          inner: { type: string }
          outer: { type: string }
          hmargin: { type: string }
          vmargin: { type: string }
        description: >
          Optional side-specific page-margin overrides for document-spine profiles.
          Values must be plain TeX dimensions such as 0.7in or 18mm.
      heading_transform:
        type: string
        enum: [preserve]
        default: preserve
      emit_visible_provenance:
        type: boolean
        default: false
      preserve_source_provenance:
        type: boolean
        default: true
      text_integrity_check:
        type: boolean
        default: true

  validation:
    type: object
    properties:
      require_source_path:
        type: boolean
        default: true
      required_text_markers:
        type: array
        items:
          type: string
