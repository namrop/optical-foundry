# Bundle Manifest Schema — v1
# Reference schema for composite stack bundle manifests.

schema: bundle_manifest_v1
description: >
  Schema for bundle-family render manifests. A bundle manifest assembles multiple
  independent Markdown sources, generated front/back matter, figures, and
  profile styling into a single styled artifact. Generic composite bundles, CAM Stack,
  and Codex 0 may share this schema family with distinct kind values when needed.

required:
  - kind
  - schema_version
  - bundle_id
  - profile
  - sources

properties:
  kind:
    type: string
    enum: [composite_bundle, cam_stack, codex_bundle]

  schema_version:
    type: string
    const: bundle_manifest_v1

  bundle_id:
    type: string
    description: Unique bundle identifier
    pattern: "^[a-z][a-z0-9_-]+$"

  bundle_name:
    type: string
    description: Human-readable bundle name

  profile:
    type: string
    description: Profile ID from the profile registry

  presentation:
    type: object
    description: Title-page / reader-facing metadata. This is not Forge packet lifecycle state.
    properties:
      title:
        type: string
      subtitle:
        type: string
      authors:
        type: array
        items:
          type: string
      date:
        type: string
      abstract:
        type: string
      title_page:
        type: object
        description: >
          Optional full title-page controls for bundle-family renders. When
          `background_image` is set, compilers enable the full title page and
          expose `titlepage_background_image` to compatible LaTeX templates.
          The path must be relative to render resource roots; absolute paths,
          parent traversal, URLs, and LaTeX control tokens are rejected.
        properties:
          enabled:
            type: boolean
            default: false
          blank_after:
            type: boolean
            default: true
            description: >
              When true, compatible templates insert one intentional blank page
              after the title page before the table of contents. Defaults true
              for enabled full title pages.
          background_image:
            type: string

  sources:
    type: array
    minItems: 1
    items:
      type: object
      required: [uid, path, role, order]
      properties:
        uid:
          type: string
          description: Unique source identifier
        path:
          type: string
          description: Path to source Markdown file
        role:
          type: string
          enum: [frontmatter, primary_anchor, supporting_anchor, appendix, reference]
        title:
          type: string
          description: Display title for section header
        include_frontmatter:
          type: string
          enum: [full, summary, none]
          default: full
        suppress_frontmatter:
          type: boolean
          default: false
          description: >
            When true, the YAML frontmatter block is completely
            stripped from this source before rendering. Use this for
            sources whose internal headings/ToC would duplicate the
            bundle-level structure, or when frontmatter display is
            not desired for a specific artifact.
        order:
          type: integer
          minimum: 1

  generated:
    type: object
    properties:
      reader_guide:
        type: object
        properties:
          enabled:
            type: boolean
          title:
            type: string
          sections:
            type: array
            items:
              type: string
      afterword:
        type: object
        properties:
          enabled:
            type: boolean
          title:
            type: string
          content:
            type: string

  section_dividers:
    type: array
    description: >
      Optional section-title/divider pages inserted before selected sources.
      Generic dividers render from title/subtitle/body. Source-backed dividers
      render a Markdown source as the divider page, leaving canonical content
      sources unchanged.
    items:
      type: object
      required: [uid]
      properties:
        uid:
          type: string
          description: Unique divider identifier for evidence.
        before_source_uid:
          type: string
          description: Insert the divider immediately before this source UID.
        before_source_order:
          type: integer
          minimum: 1
          description: Insert the divider immediately before the source with this order.
        title:
          type: string
          description: Generic divider title when no source is provided.
        subtitle:
          type: string
        body:
          type: string
        profile_id:
          type: string
          description: Optional divider-local profile ID for profile-aware divider styling/evidence.
        profile:
          type: string
          description: Alias for profile_id.
        profile_family:
          type: string
          description: Optional guard; validation fails if profile_id resolves to a different family.
        background_image:
          type: string
          description: Relative PNG/JPG/PDF background image for the divider page.
        force_right_page:
          type: boolean
          default: true
          description: Insert a labeled intentional blank page as needed so the divider opens on a recto/right page.
        blank_after:
          type: boolean
          default: false
          description: Insert a labeled intentional blank page immediately after the divider.
        source:
          type: object
          description: Optional Markdown source to use as the divider page.
          properties:
            path:
              type: string
            include_frontmatter:
              type: string
              enum: [full, summary, none]
              default: none

  figures:
    type: array
    items:
      type: object
      required: [path, caption]
      properties:
        path:
          type: string
        caption:
          type: string
        placement:
          type: string
          enum: [dedicated_page, near, section_open, end_of_packet]
          default: dedicated_page
        after_source_order:
          type: integer
          minimum: 0

  render:
    type: object
    properties:
      include_toc:
        type: boolean
        default: true
      numbering_strategy:
        type: string
        enum: [continuous, section_dividers, faithful_section_dividers]
        default: continuous
        description: >
          Use section_dividers/faithful_section_dividers to make manifest section
          dividers own numbered top-level sections, demote source headings below
          their divider, and emit frontmatter/mainmatter/appendix transitions.
      toc_depth:
        type: integer
        default: 3
      page_size:
        type: string
        enum: [letter, a4, A4, a4paper, a5, A5, a5paper, half_letter, half-letter, "half letter", halfletter, statement]
        default: letter
        description: >
          Optional PDF paper-size override for bundle-family document-spine
          renders. A4 and A5 lower to geometry paper options; half-letter lowers
          to paperwidth=5.5in and paperheight=8.5in. Physical-sheet manifest
          kinds should continue to use their sheet specs instead.
      margin:
        type: string
        pattern: '^(?:\\d+(?:\\.\\d+)?|\\.\\d+)(?:in|pt|mm|cm|pc|em|ex)$'
        description: >
          Optional uniform page-margin override for document-spine profiles,
          e.g. 0.7in. Omit to preserve the active profile default margin.
      page_margin:
        type: string
        pattern: '^(?:\\d+(?:\\.\\d+)?|\\.\\d+)(?:in|pt|mm|cm|pc|em|ex)$'
        description: Alias for margin.
      margins:
        type: object
        additionalProperties: false
        properties:
          top: { type: string }
          bottom: { type: string }
          left: { type: string }
          right: { type: string }
          inner: { type: string }
          outer: { type: string }
          hmargin: { type: string }
          vmargin: { type: string }
        description: >
          Optional side-specific page-margin overrides for document-spine profiles.
          Values must be plain TeX dimensions such as 0.7in or 18mm.
      preserve_source_provenance:
        type: boolean
        default: true
      text_integrity_check:
        type: boolean
        default: true
      visual_page_samples:
        type: boolean
        default: true
      page_sample_format:
        type: string
        enum: [png, jpg]
        default: png

  validation:
    type: object
    properties:
      require_all_source_paths:
        type: boolean
        default: true
      require_all_figure_paths:
        type: boolean
        default: true
      require_unique_uids:
        type: boolean
        default: true
      required_text_markers:
        type: array
        items:
          type: string
