# Bundle Manifest Schema — v1
# Reference schema for composite stack bundle manifests.

schema: bundle_manifest_v1
description: >
  Schema for bundle-family render manifests. A bundle manifest assembles multiple
  independent Markdown sources, generated front/back matter, figures, and
  profile styling into a single styled artifact. Generic composite bundles, CAM Stack,
  and Codex 0 may share this schema family with distinct kind values when needed.

  This file is the manifest's whole interface (architecture review 2026-10-01,
  candidate 4; ruling 01a0f8ba-4937). The bundle compilers validate every
  manifest against it before compiling, so a key that is not declared here is
  an error, not a silent no-op. A key marked `x-of-unread: true` is accepted
  for compatibility with existing manifests but nothing in the engine reads it.
  `tests/test_bundle_schema.py` checks both directions: every key the bundle
  compiler reads is declared, and no declared-unread key is read.

additionalProperties: false

required:
  - kind
  - schema_version
  - bundle_id
  - profile
  - sources

properties:
  kind:
    type: string
    enum: [composite_bundle, cam_stack, codex_bundle]

  schema_version:
    type: string
    const: bundle_manifest_v1

  bundle_id:
    type: string
    description: Unique bundle identifier
    pattern: "^[a-z][a-z0-9_-]+$"

  bundle_name:
    type: string
    description: Human-readable bundle name

  profile:
    type: string
    description: Profile ID from the profile registry

  resource_roots:
    type: array
    minItems: 1
    description: >
      Optional ordered work-owned resource roots. Relative paths resolve from
      this manifest's directory. Roots must exist, be directories, and be safe
      for raw LaTeX graphicspath injection. Effective precedence is run-local,
      source-local, these manifest roots, then profile compatibility roots.
    items:
      type: string
      minLength: 1

  variables:
    type: object
    description: >
      Bundle-level template variables. Keys are checked against the engine's
      allowlist (engine/manifest_compiler.py DOCUMENT_VARIABLE_ALLOWLIST); a key
      outside it is recorded in evidence as rejected and not passed on.

  volumes:
    type: array
    minItems: 2
    description: >
      The work in several physical volumes (promotion map B1). Each volume
      starts before a named source; the first starts at the first source.
      `cli manifest` splits the manifest into one bundle per volume and renders
      them with the work render loop, each body continuing the folios of the
      volume before (engine/volumes.py, engine/work_render.py).
    items:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]*$"
        title:
          type: string
          description: Defaults to "Volume <roman numeral>".
        subtitle:
          type: string
        before_source_uid:
          type: string
          description: The volume starts with this source (omit for the first volume).

  volume:
    type: object
    description: >
      Written by engine/volumes.py and engine/work_render.py into each volume's
      bundle; not written by hand.
    additionalProperties: false
    required: [id, number, count]
    properties:
      id: { type: string }
      number: { type: integer, minimum: 1 }
      count: { type: integer, minimum: 1 }
      title: { type: string }
      subtitle: { type: string }
      body_folio_start:
        type: integer
        minimum: 1
        description: The folio the body starts at (seated on a recto when two-sided).
      seat:
        type: string
        enum: [auto, source]
        description: >
          Who seats the body folio. auto (default): the template if it seats
          $body_folio_start$, else the engine. source: the volume's own sources do,
          reading the number through \OFWorkSeat (engine/work_refs.py).
      work_labels:
        type: object
        additionalProperties: { type: string }
        description: >
          Written by engine/work_render.py: every label the work's rendered volumes
          offer, keyed <volume id>:<normalized outline title | divider:uid>. The
          compiler resolves \OFWorkRef{...} in the sources from it.
      work_ref_placeholder:
        type: string
        description: What a reference prints before its label exists (default 000).
      endnotes:
        type: object
        description: Written by engine/volumes.py (B4); marks maps source uid to {note id -> number}.
        properties:
          sink: { type: string }
          marks: { type: object }
          count: { type: integer }
          notes_source_uid: { type: string }
      extent:
        type: object
        description: The whole work's measured extent (A5), recorded on every volume.
        properties:
          exact: { type: integer }
          rounded: { type: integer }
          printed: {}
          sources: { type: integer }
      work_contents:
        type: object
        additionalProperties: false
        properties:
          title: { type: string }
          rows:
            type: array
            items:
              type: object
              required: [volume, volume_title, volume_label, title]
              properties:
                volume: { type: string }
                volume_title: { type: string }
                volume_label: { type: string }
                title: { type: string }
                folio: { type: integer }
                ref: { type: string, description: "The work reference the folio resolves from, when folio is not given." }
                uid: { type: string }

  selection:
    type: object
    x-of-unread: true
    description: >
      Provenance written by `cli select` (engine/selection.py): the selection
      file this manifest was composed from, its hash, counts and origins.

  fidelity_notes:
    type: object
    x-of-unread: true
    description: Free-form notes on how faithfully this manifest reproduces a target artifact.

  presentation:
    type: object
    description: Title-page / reader-facing metadata. This is not Forge packet lifecycle state.
    additionalProperties: false
    properties:
      title:
        type: string
      subtitle:
        type: string
      authors:
        type: array
        items:
          type: string
      date:
        type: string
      abstract:
        type: string
      title_page:
        type: object
        description: >
          Optional full title-page controls for bundle-family renders. When
          `background_image` is set, compilers enable the full title page and
          expose `titlepage_background_image` to compatible LaTeX templates.
          The path must be relative to render resource roots; absolute paths,
          parent traversal, URLs, and LaTeX control tokens are rejected.
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            default: false
          blank_after:
            type: boolean
            default: true
            description: >
              When true, compatible templates insert one intentional blank page
              after the title page before the table of contents. Defaults true
              for enabled full title pages.
          background_image:
            type: string
      extent:
        type: object
        description: >
          A5. Measure the work's prose words at build time and set
          `variables.colophon_words` (substituted into <<COLOPHON_WORDS>>), unless the
          manifest sets that variable itself. A volumed work is measured whole.
        additionalProperties: false
        properties:
          enabled: { type: boolean, default: true }
          round: { type: integer, minimum: 1, default: 1000 }
          form: { type: string, enum: [english, number], default: english }
          visible_commands:
            type: array
            description: LaTeX commands whose braced argument is prose (default OFChapterOpener).
            items: { type: string, pattern: "^[A-Za-z@]+$" }

  sources:
    type: array
    minItems: 1
    items:
      type: object
      required: [uid, path, role, order]
      additionalProperties: false
      properties:
        uid:
          type: string
          description: Unique source identifier
        path:
          type: string
          description: Path to source Markdown file
        role:
          type: string
          enum: [frontmatter, primary_anchor, supporting_anchor, appendix, reference]
        title:
          type: string
          description: Display title for section header
        include_frontmatter:
          type: string
          enum: [full, summary, none]
          default: full
        suppress_frontmatter:
          type: boolean
          default: false
          description: >
            When true, the YAML frontmatter block is completely
            stripped from this source before rendering. Use this for
            sources whose internal headings/ToC would duplicate the
            bundle-level structure, or when frontmatter display is
            not desired for a specific artifact.
        order:
          type: integer
          minimum: 1
        profile_id:
          type: string
          x-of-unread: true
          description: Recorded intent only; a bundle renders through its one profile.
        chapter_opener:
          type: object
          additionalProperties: false
          description: >
            The heading block that begins this source: its title, and optionally
            an epigraph (inline, or harvested from a file's epigraph_* frontmatter).
          properties:
            title:
              type: string
            epigraph:
              type: object
              additionalProperties: false
              properties:
                text: { type: string }
                author: { type: string }
                source: { type: string }
                date: { type: string }
                translator: { type: string }
                speaker: { type: string }
                context: { type: string }
                register: { type: string }
            epigraph_from:
              type: string
              description: Path (relative to the manifest) of a file whose epigraph_* frontmatter supplies the epigraph.
            epigraph_from_source:
              type: boolean
              description: Take the epigraph from this source's own epigraph_* frontmatter.
        page_break_before:
          type: boolean
          default: true
          description: >
            Start this source on a new page. A source carrying a chapter opener
            always does.
        passage_separator:
          type: string
          description: Ornament marker emitted between flowing sources when page_break_before is false.
        codex_register:
          type: string
          description: Source-level register; codex_bundle manifests on the codex0 profile only.
        strip_leading_heading:
          type: boolean
          default: false
          description: Remove the body's title heading (its first heading, if level 1); the chapter opener carries it.
        strip_body_metadata_blocks:
          type: boolean
          default: false
          description: >
            Remove YAML blocks inside the body, which pandoc would otherwise read
            as document metadata in the assembled bundle. Counted in evidence.
        selection:
          type: object
          x-of-unread: true
          description: Provenance written by `cli select` (date and title origins).
        running_text:
          type: object
          description: >
            Optional per-source running header/footer text override. Applied at
            the source boundary without changing the profile's geometry, assets,
            or template. `division`/`header_right` feed the right header,
            `tagline` feeds yugenRule's header tagline, and
            `footeremail`/`footer_email`/`footer` feed the right footer.
          properties:
            division:
              type: string
            header:
              type: string
            header_right:
              type: string
            tagline:
              type: string
            footer:
              type: string
            footer_right:
              type: string
            footeremail:
              type: string
            footer_email:
              type: string

  generated:
    type: object
    properties:
      reader_guide:
        type: object
        properties:
          enabled:
            type: boolean
          title:
            type: string
          sections:
            type: array
            items:
              type: string
      afterword:
        type: object
        properties:
          enabled:
            type: boolean
          title:
            type: string
          content:
            type: string

  section_dividers:
    type: array
    description: >
      Optional section-title/divider pages inserted before selected sources.
      Generic dividers render from title/subtitle/body. Source-backed dividers
      render a Markdown source as the divider page, leaving canonical content
      sources unchanged.
    items:
      type: object
      required: [uid]
      additionalProperties: false
      properties:
        uid:
          type: string
          description: Unique divider identifier for evidence.
        kind:
          type: string
          description: Name of a divider kind declared by the selected profile package.
        slots:
          type: object
          description: Typed values for the selected divider kind; its package declares allowed names.
        before_source_uid:
          type: string
          description: Insert the divider immediately before this source UID.
        before_source_order:
          type: integer
          minimum: 1
          description: Insert the divider immediately before the source with this order.
        title:
          type: string
          description: Generic divider title when no source is provided.
        subtitle:
          type: string
        body:
          type: string
        profile_id:
          type: string
          description: Optional divider-local profile ID for profile-aware divider styling/evidence.
        profile:
          type: string
          description: Alias for profile_id.
        profile_family:
          type: string
          description: Optional guard; validation fails if profile_id resolves to a different family.
        background_image:
          type: string
          description: Relative PNG/JPG/PDF background image for the divider page.
        stock:
          type: string
          enum: [text, cardstock, specialty]
          default: text
          description: >
            Physical print stock the divider is intended to land on. `text` is the
            default text-block stock; `cardstock` marks the divider for a heavier
            stock (e.g. part-opener cards); `specialty` is a catch-all for other
            named stocks. Consumed by the furnish map (see docs/plans/2026-07-05
            book-production brief §3) so imposition can flag which physical
            sheets need alternate stock loaded on the printer.
        print_image:
          type: string
          description: >
            Optional relative PNG/JPG/PDF path to print on this divider's stock
            (typically used when stock != text and the divider is a plate rather
            than a title/epigraph page). Independent of `background_image`:
            print_image is the divider content, background_image is decorative
            behind divider content. Both may be set.
        force_right_page:
          type: boolean
          default: true
          description: Insert a labeled intentional blank page as needed so the divider opens on a recto/right page.
        blank_after:
          type: boolean
          default: false
          description: Insert a labeled intentional blank page immediately after the divider.
        source:
          type: object
          description: Optional Markdown source to use as the divider page.
          additionalProperties: false
          properties:
            path:
              type: string
            heading_transform:
              type: string
            include_frontmatter:
              type: string
              enum: [full, summary, none]
              default: none
        running_text:
          type: object
          description: >
            Optional running header/footer text override applied at the divider
            boundary. Uses the same keys as source.running_text.
          properties:
            division:
              type: string
            header:
              type: string
            header_right:
              type: string
            tagline:
              type: string
            footer:
              type: string
            footer_right:
              type: string
            footeremail:
              type: string
            footer_email:
              type: string

  figures:
    type: array
    items:
      type: object
      required: [path, caption]
      additionalProperties: false
      properties:
        path:
          type: string
        caption:
          type: string
        placement:
          type: string
          enum: [dedicated_page, near, section_open, end_of_packet]
          default: dedicated_page
        after_source_order:
          type: integer
          minimum: 0

  render:
    type: object
    additionalProperties: false
    properties:
      include_toc:
        type: boolean
        default: true
      toc_depth:
        type: integer
        default: 3
      numbersections:
        type: boolean
      assembly_strategy:
        type: string
        description: combined_markdown (default) or faithful_stack (keeps source heading levels, no wrapper headings).
      suppress_source_wrapper_headings:
        type: boolean
        description: Do not write a heading per source (defaults on for faithful_stack and section-divider numbering).
      preserve_source_heading_levels:
        type: boolean
        description: Keep each source's heading levels instead of demoting them under the source.
      emit_visible_provenance:
        type: boolean
        default: true
        description: Append a Provenance & Evidence section listing every source and its hash.
      numbering:
        type: string
        description: Alias for numbering_strategy.
      work_contents:
        description: >
          With `volumes`, give every volume a contents of the whole work: each
          divider with its volume and folio, read from the rendered volumes' PDF
          page labels (promotion map B2). true, or {enabled, title}.
        oneOf:
          - type: boolean
          - type: object
            additionalProperties: false
            properties:
              enabled: { type: boolean }
              title: { type: string }
      passes:
        type: object
        description: >
          With `volumes`, planned passes (map B3, optional): measuring passes in draft,
          a fixed-point gate on every pass that reads a prior pass's labels, one final
          wave rendered full (`final_parallel` at a time), and each final proved to
          have its draft's shape. A failed proof stops the build; there is no retry.
        additionalProperties: false
        properties:
          final_parallel: { type: integer, minimum: 1, default: 1 }
          prove_final: { type: boolean, default: true }
      refs:
        type: object
        description: >
          With `volumes`, references across the volumes (map step 6,
          engine/work_refs.py): what an unresolved \OFWorkRef prints, and how many
          passes the work render loop may take to reach its fixed point.
        additionalProperties: false
        properties:
          placeholder: { type: string, default: "000" }
          max_passes: { type: integer, minimum: 1, default: 4 }
      plates:
        type: object
        description: >
          Floating full-page plates (map D3): \OFFloatingPlate{asset} in a source is
          seated during pagination on the first legal recto in its chapter, the page
          prints no running head (D5), and containment is re-checked on every render
          from the page ledger. Needs LuaLaTeX.
        additionalProperties: false
        properties:
          floating: { type: boolean, default: true }
          gate: { type: boolean, default: true, description: A containment violation fails the render. }
      endnotes:
        type: object
        description: >
          With `volumes`, print every other volume's Markdown footnotes in one
          volume (`sink`), grouped by the volume that carries them and numbered from
          1 in each; the carrying volumes keep only the raised numbers (map B4).
        additionalProperties: false
        required: [sink]
        properties:
          sink: { type: string }
          title: { type: string }
          intro: { type: string }
          group_title: { type: string }
          before_source_uid: { type: string }
      delivery:
        type: object
        description: >
          How the artifact is meant to be used physically (screen or bound,
          binding, duplex, margins, running headers, colophon, illumination,
          imposition). Validated by engine/delivery.py.
      passthrough_single_source:
        x-of-unread: true
      emit_provenance_section:
        x-of-unread: true
      preserve_source_metadata:
        x-of-unread: true
      numbering_strategy:
        type: string
        enum: [continuous, section_dividers, faithful_section_dividers]
        default: continuous
        description: >
          Use section_dividers/faithful_section_dividers to make manifest section
          dividers own numbered top-level sections, demote source headings below
          their divider, and emit frontmatter/mainmatter/appendix transitions.
      page_size:
        type: string
        enum: [letter, a4, A4, a4paper, a5, A5, a5paper, half_letter, half-letter, "half letter", halfletter, statement]
        default: letter
        description: >
          Optional PDF paper-size override for bundle-family document-spine
          renders. A4 and A5 lower to geometry paper options; half-letter lowers
          to paperwidth=5.5in and paperheight=8.5in. Physical-sheet manifest
          kinds should continue to use their sheet specs instead.
      margin:
        type: string
        pattern: '^(?:\d+(?:\.\d+)?|\.\d+)(?:in|pt|mm|cm|pc|em|ex)$'
        description: >
          Optional uniform page-margin override for document-spine profiles,
          e.g. 0.7in. Omit to preserve the active profile default margin.
      page_margin:
        type: string
        pattern: '^(?:\d+(?:\.\d+)?|\.\d+)(?:in|pt|mm|cm|pc|em|ex)$'
        description: Alias for margin.
      margins:
        type: object
        additionalProperties: false
        properties:
          top: { type: string }
          bottom: { type: string }
          left: { type: string }
          right: { type: string }
          inner: { type: string }
          outer: { type: string }
          hmargin: { type: string }
          vmargin: { type: string }
        description: >
          Optional side-specific page-margin overrides for document-spine profiles.
          Values must be plain TeX dimensions such as 0.7in or 18mm.
      preserve_source_provenance:
        type: boolean
        x-of-unread: true
      text_integrity_check:
        type: boolean
        x-of-unread: true
      visual_page_samples:
        type: boolean
        x-of-unread: true
      page_sample_format:
        type: string
        enum: [png, jpg]
        x-of-unread: true

  validation:
    type: object
    additionalProperties: false
    description: >
      Declared expectations. The bundle compiler always requires every source
      path to exist and every uid to be unique, whatever these say.
    properties:
      require_all_source_paths:
        type: boolean
        x-of-unread: true
      require_all_figure_paths:
        type: boolean
        x-of-unread: true
      require_unique_uids:
        type: boolean
        x-of-unread: true
      required_text_markers:
        x-of-unread: true
        type: array
