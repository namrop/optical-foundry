# Bundle Manifest Schema — v1
# Reference schema for composite stack bundle manifests.

schema: bundle_manifest_v1
description: >
  Schema for composite stack bundle manifests. A bundle assembles multiple
  independent Markdown sources, generated front/back matter, figures, and
  profile styling into a single styled PDF.

required:
  - kind
  - schema_version
  - bundle_id
  - profile
  - sources

properties:
  kind:
    type: string
    const: composite_stack_packet

  schema_version:
    type: string
    const: bundle_manifest_v1

  bundle_id:
    type: string
    description: Unique bundle identifier
    pattern: "^[a-z][a-z0-9_-]+$"

  bundle_name:
    type: string
    description: Human-readable bundle name

  profile:
    type: string
    description: Profile ID from the profile registry

  packet:
    type: object
    properties:
      title:
        type: string
      subtitle:
        type: string
      authors:
        type: array
        items:
          type: string
      date:
        type: string
      abstract:
        type: string

  sources:
    type: array
    minItems: 1
    items:
      type: object
      required: [uid, path, role, order]
      properties:
        uid:
          type: string
          description: Unique source identifier
        path:
          type: string
          description: Path to source Markdown file
        role:
          type: string
          enum: [primary_anchor, supporting_anchor, appendix, reference]
        title:
          type: string
          description: Display title for section header
        include_frontmatter:
          type: string
          enum: [full, summary, none]
          default: full
        order:
          type: integer
          minimum: 1

  generated:
    type: object
    properties:
      reader_guide:
        type: object
        properties:
          enabled:
            type: boolean
          title:
            type: string
          sections:
            type: array
            items:
              type: string
      afterword:
        type: object
        properties:
          enabled:
            type: boolean
          title:
            type: string
          content:
            type: string

  figures:
    type: array
    items:
      type: object
      required: [path, caption]
      properties:
        path:
          type: string
        caption:
          type: string
        placement:
          type: string
          enum: [dedicated_page, near, section_open, end_of_packet]
          default: dedicated_page
        after_source_order:
          type: integer
          minimum: 0

  render:
    type: object
    properties:
      include_toc:
        type: boolean
        default: true
      toc_depth:
        type: integer
        default: 3
      preserve_source_provenance:
        type: boolean
        default: true
      text_integrity_check:
        type: boolean
        default: true
      visual_page_samples:
        type: boolean
        default: true
      page_sample_format:
        type: string
        enum: [png, jpg]
        default: png

  validation:
    type: object
    properties:
      require_all_source_paths:
        type: boolean
        default: true
      require_all_figure_paths:
        type: boolean
        default: true
      require_unique_uids:
        type: boolean
        default: true
      required_text_markers:
        type: array
        items:
          type: string
