# Sticker Sheet Manifest Schema — v1
# Reference schema for sticker_sheet render manifests.

schema: sticker_sheet_v1
description: >
  Schema for sticker-sheet render manifests. The sheet is manifest-driven; cells
  may contain inline content or point to Markdown/source assets.

required:
  - kind
  - schema_version
  - sheet_id
  - profile
  - layout
  - cells

properties:
  kind:
    type: string
    const: sticker_sheet

  schema_version:
    type: string
    const: sticker_sheet_v1

  sheet_id:
    type: string
    description: Unique sticker sheet identifier.

  profile:
    type: string
    description: Profile ID from the profile registry, e.g. sticker_sheet.

  layout:
    type: object
    required: [grid]
    properties:
      grid:
        type: array
        items: { type: integer }
      cell_size:
        type: array
        items: { type: number }
      show_cut_lines:
        type: boolean
        default: true
      cut_line_style:
        type: string
        default: dashed

  cells:
    type: array
    minItems: 1
    items:
      type: object
      required: [position]
      properties:
        position:
          type: array
          items: { type: integer }
        content:
          type: string
        source:
          type: string
        image:
          type: string
