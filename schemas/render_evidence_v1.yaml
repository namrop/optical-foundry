# Render Evidence Schema — v1
# Reference schema for render evidence JSON sidecars.

schema: render_evidence_v1
description: >
  Schema for render evidence JSON sidecars. Every render produces an evidence
  JSON recording provenance, output metadata, integrity checks, and boundary
  assertions.

properties:
  schema_version:
    type: string
    const: render_evidence_v1

  render_id:
    type: string
    description: Unique render event identifier (UUID or timestamp-based)

  status:
    type: string
    enum: [ok, error]
    description: Top-level render outcome. Successful renders use `ok`; failed renders use `error`.

  profile:
    type: object
    properties:
      profile_id: { type: string }
      profile_name: { type: string }
      profile_class: { type: string }
      profile_version: { type: string }

  input:
    type: object
    properties:
      path: { type: string }
      digest_sha256: { type: string }
      bytes: { type: integer }

  source_inventory:
    type: array
    description: For multi-source renders (bundles, packets, label sheets)
    items:
      type: object
      properties:
        path: { type: string }
        uid: { type: string }
        role: { type: string }
        digest_sha256: { type: string }
        frontmatter_preserved: { type: boolean }
        resolved: { type: boolean }

  figure_inventory:
    type: array
    items:
      type: object
      properties:
        path: { type: string }
        caption: { type: string }
        placement: { type: string }
        present_in_pdf: { type: boolean }

  resource_resolution:
    type: object
    description: >
      Ordered render resource roots plus engine-visible and raw-LaTeX resource
      winners. Shadowed matches are retained so compatibility fallback
      collisions remain explicit during migrations.
    properties:
      effective_roots:
        type: array
        items:
          type: object
          properties:
            path: { type: string }
            origin:
              type: string
              enum: [run, source, manifest, profile]
            order: { type: integer }
      resolved_resources:
        type: array
        items:
          type: object
          properties:
            reference: { type: string }
            winner: { type: [string, "null"] }
            winner_origin:
              type: [string, "null"]
            shadowed:
              type: array
              items: { type: string }
      warnings:
        type: array
        items: { type: string }

  render_metadata:
    type: object
    properties:
      profile: { type: string }
      profile_defaults_file: { type: string }
      template: { type: string }
      style: { type: string }
      command: { type: string }
      pandoc_version: { type: string }
      tex_engine: { type: string }
      page_geometry_options:
        type: array
        items: { type: string }
      page_margin_options:
        type: array
        items: { type: string }
      render_duration_ms: { type: integer }
      render_mode:
        type: string
        enum: [full, measure]
        description: "measure = a render made only to be measured by a later pass; imposition and bindery preflight were skipped. Not a deliverable."
      rendered_at: { type: string }

  output:
    type: object
    properties:
      pdf_path: { type: string }
      pdf_pages: { type: integer }
      pdf_bytes: { type: integer }
      pdf_sha256: { type: string }
      page_size: { type: string }
      pdf_version: { type: string }

  integrity:
    type: object
    properties:
      text_extract_exists: { type: boolean }
      expected_markers_found:
        type: array
        items:
          type: object
          properties:
            marker: { type: string }
            found: { type: boolean }
            page: { type: integer }
      all_sources_represented: { type: boolean }
      toc_present: { type: boolean }
      toc_depth: { type: integer }
      figures_validated: { type: boolean }

  visual_samples:
    type: array
    items:
      type: object
      properties:
        page: { type: integer }
        path: { type: string }

  validation:
    type: object
    description: Explicit validation surface separated from raw render metadata and boundary assertions.
    properties:
      status:
        type: string
        enum: [passed, failed]
      checks:
        type: object
        properties:
          pdf_written: { type: boolean }
          text_extract_exists: { type: boolean }
          all_sources_represented: { type: boolean }
          figure_inventory_recorded: { type: boolean }
          raw_latex_leakage: { type: boolean }
      warning_count: { type: integer }
      errors:
        type: array
        items: { type: string }

  warnings:
    type: array
    items:
      type: string

  boundary:
    type: object
    properties:
      target_legacy_profile_tree_mutated: { type: boolean, const: false }
      production_output: { type: boolean, const: false }
      packet_local_generated_only: { type: boolean, const: true }
